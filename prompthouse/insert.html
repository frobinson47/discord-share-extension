<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Insert from Prompt House</title>
  <link rel="stylesheet" href="prompthouse.css" />
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">📚 Insert from Prompt House</span>

  <script src="insert.js"></script>
</body>
</html>
